name: Empirical falsification suite

on:
  push:
  pull_request:

jobs:
  scout-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject incomplete counted Scout cohorts
        run: python tools/scout_cohort_check.py
      - name: Verify the public Bole certification status
        run: python tools/bole_certify.py
      - name: Test the certification gate
        run: python tools/test_bole_certify.py
      - name: Recompute every 4C Fit scorecard
        run: python tools/fit_score_check.py
      - name: Test the 4C Fit contract
        run: python tools/test_fit_score_check.py
      - name: Verify the published Harness Ladder
        run: python tools/harness_ladder_check.py
      - name: Test the Harness Ladder calibration gate
        run: python tools/test_harness_ladder_check.py
      - name: Resolve every pinned upstream evidence path
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/evidence_link_check.py

  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/requirements.txt
      - name: Install pinned systems
        run: python -m pip install -r experiments/requirements.txt
      - name: Run counterfactual experiments
        run: python experiments/run_all.py

  inference-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/requirements-inference.txt
      - name: Install pinned inference runtime
        run: python -m pip install -r experiments/requirements-inference.txt
      - name: Run inference boundary control
        run: python experiments/onnxruntime_infra_boundary.py
