<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="896" viewBox="0 0 1792 896" role="img" aria-labelledby="title desc">
  <title id="title">See a Harness. Ask 4C.</title>
  <desc id="desc">4C is the evaluation standard for AI Harnesses: Cost, Compatibility, Continuity, and Cognition.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B9C6D8" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#FFFFFF" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1792" height="896" fill="#EEF3F9"/>
  <rect width="1792" height="896" fill="url(#grid)"/>
  <rect width="1792" height="42" fill="#101826"/>
  <text x="52" y="28" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">4C // HARNESS EVALUATION STANDARD // OPEN METHOD</text>
  <text x="1740" y="28" text-anchor="end" fill="#8FA3BC" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15">SPEC 04—C</text>

  <g transform="translate(56 92)">
    <text x="0" y="24" fill="#2457FF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="2">WHEN THE PRODUCT IS AN AI HARNESS</text>
    <text x="-4" y="152" fill="#101826" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="126" font-weight="900" letter-spacing="-6">SEE A</text>
    <text x="-4" y="278" fill="#101826" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="126" font-weight="900" letter-spacing="-6">HARNESS.</text>
    <rect x="0" y="310" width="700" height="150" fill="#2457FF"/>
    <text x="28" y="425" fill="#FFFFFF" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="114" font-weight="900" letter-spacing="-5">ASK 4C.</text>

    <line x1="0" y1="512" x2="700" y2="512" stroke="#101826" stroke-width="3"/>
    <text x="0" y="557" fill="#101826" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700">Every Harness. The same four questions.</text>
    <text x="0" y="600" fill="#53657A" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Score the execution path—not the pitch.</text>

    <g transform="translate(0 648)">
      <rect width="90" height="90" rx="45" fill="#FF5A36"/>
      <text x="45" y="54" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="900">4C</text>
      <text x="112" y="35" fill="#101826" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">THE HARNESS</text>
      <text x="112" y="64" fill="#101826" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">STANDARD</text>
    </g>
  </g>

  <g transform="translate(858 92)">
    <rect width="878" height="698" fill="#101826"/>
    <rect width="878" height="698" fill="url(#micro)"/>
    <text x="38" y="48" fill="#8FA3BC" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">RUN THE CHECK / ACTIVE PRESSURES ONLY</text>

    <g transform="translate(38 82)">
      <rect width="802" height="126" fill="#192537" stroke="#38506C"/>
      <rect width="14" height="126" fill="#FDBD2E"/>
      <text x="42" y="50" fill="#FDBD2E" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">C₁</text>
      <text x="98" y="52" fill="#FFFFFF" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">COST</text>
      <text x="98" y="88" fill="#AEBBCB" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">Limits → more verified outcomes?</text>
      <path d="M738 43h28m-14-14v28" stroke="#FDBD2E" stroke-width="3"/>
    </g>

    <g transform="translate(38 220)">
      <rect width="802" height="126" fill="#192537" stroke="#38506C"/>
      <rect width="14" height="126" fill="#24C3B5"/>
      <text x="42" y="50" fill="#24C3B5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">C₂</text>
      <text x="98" y="52" fill="#FFFFFF" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">COMPATIBILITY</text>
      <text x="98" y="88" fill="#AEBBCB" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">Models · tools · providers · semantics</text>
      <path d="M738 43h28m-14-14v28" stroke="#24C3B5" stroke-width="3"/>
    </g>

    <g transform="translate(38 358)">
      <rect width="802" height="126" fill="#192537" stroke="#38506C"/>
      <rect width="14" height="126" fill="#7C6BFF"/>
      <text x="42" y="50" fill="#9D91FF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">C₃</text>
      <text x="98" y="52" fill="#FFFFFF" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">CONTINUITY</text>
      <text x="98" y="88" fill="#AEBBCB" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">State · recovery · handoffs · change</text>
      <path d="M738 43h28m-14-14v28" stroke="#9D91FF" stroke-width="3"/>
    </g>

    <g transform="translate(38 496)">
      <rect width="802" height="126" fill="#192537" stroke="#38506C"/>
      <rect width="14" height="126" fill="#FF5A36"/>
      <text x="42" y="50" fill="#FF8063" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">C₄</text>
      <text x="98" y="52" fill="#FFFFFF" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">COGNITION</text>
      <text x="98" y="88" fill="#AEBBCB" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">Does evidence improve future policy?</text>
      <path d="M738 43h28m-14-14v28" stroke="#FF8063" stroke-width="3"/>
    </g>

    <text x="38" y="663" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1">ACTIVATE → INSPECT → SCORE → FALSIFY</text>
    <text x="840" y="663" text-anchor="end" fill="#8FA3BC" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15">4C-HARNESS</text>
  </g>

  <rect x="0" y="846" width="1792" height="50" fill="#2457FF"/>
  <text x="52" y="878" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">github.com/warlockee/4c-harness</text>
  <text x="1740" y="878" text-anchor="end" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">THE OPEN EVALUATION METHOD FOR AI HARNESSES</text>
</svg>
